services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://devices:devices@postgres:5432/devices?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: devices
      POSTGRES_PASSWORD: devices
      POSTGRES_DB: devices
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devices -d devices"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Test services only start with `--profile test`.
  test:
    image: golang:1.27.4
    working_dir: /src
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://devices:devices@postgres-test:5432/devices_test?sslmode=disable
    command: go test -race -cover -count=1 ./...
    depends_on:
      postgres-test:
        condition: service_healthy
    profiles: [test]

  # Throwaway database for integration tests: in memory, separate from dev data.
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: devices
      POSTGRES_PASSWORD: devices
      POSTGRES_DB: devices_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devices -d devices_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    profiles: [test]

volumes:
  postgres-data:
  go-mod-cache:
  go-build-cache:
